name: Publish independent Enygma research site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Verify frozen research and current public annex separately
        run: |
          git worktree add --detach "$RUNNER_TEMP/frozen-research" 5710488133292dfbe3ee1df3b731b198a5999031
          cmp EVIDENCE-MANIFEST.json "$RUNNER_TEMP/frozen-research/EVIDENCE-MANIFEST.json"
          diff -qr site "$RUNNER_TEMP/frozen-research/site" --exclude=public-anchor.json --exclude=public-anchor.js --exclude=index.html --exclude=figure-viewer.css --exclude=figure-viewer.js
          python3 qa/check_public_copy.py "$RUNNER_TEMP/frozen-research"
          ( cd "$RUNNER_TEMP/frozen-research" && python3 qa/check_manifest.py && python3 qa/verify_public.py && python3 qa/verify_local_live.py --check-only && python3 qa/check_site.py --check-only )
          python3 qa/check_anchor.py --live-rpc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
