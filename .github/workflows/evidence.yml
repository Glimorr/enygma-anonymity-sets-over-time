name: Independent Enygma evidence verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Mount the immutable 93-file research archive
        run: |
          git worktree add --detach "$RUNNER_TEMP/frozen-research" 5710488133292dfbe3ee1df3b731b198a5999031
          cmp EVIDENCE-MANIFEST.json "$RUNNER_TEMP/frozen-research/EVIDENCE-MANIFEST.json"
          diff -qr site "$RUNNER_TEMP/frozen-research/site" --exclude=public-anchor.json
      - name: Verify frozen manifest completeness and all content hashes
        run: cd "$RUNNER_TEMP/frozen-research" && python3 qa/check_manifest.py
      - name: Reconstruct the 5000 source-level observations
        run: cd "$RUNNER_TEMP/frozen-research" && python3 qa/verify_public.py
      - name: Independently decode saved Hub event receipts
        run: cd "$RUNNER_TEMP/frozen-research" && python3 qa/verify_local_live.py --check-only
      - name: Check site, accessibility and observed bank-set provenance
        run: cd "$RUNNER_TEMP/frozen-research" && python3 qa/check_site.py --check-only
      - name: Run six negative and tamper controls
        run: cd "$RUNNER_TEMP/frozen-research" && python3 qa/adversarial_checks.py
      - name: Recheck frozen evidence after tamper controls
        run: cd "$RUNNER_TEMP/frozen-research" && python3 qa/check_manifest.py
      - name: Independently authenticate the retrospective public Testnet annex
        run: python3 qa/check_anchor.py --live-rpc

  pinned-native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5710488133292dfbe3ee1df3b731b198a5999031
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Fetch pinned official Rayls revisions, apply declared patches
        run: python3 qa/bootstrap_sources.py
      - name: Verify archived native evidence and untouched relayer code
        run: python3 qa/verify_native.py
      - name: Run production anonymity-set selection function directly
        env:
          ENYGMA_W2_OUTPUT: ${{ runner.temp }}/w2-reproduction
        working-directory: source/rayls-sovereign-relayer
        run: go test ./enygma/service -run '^TestW2ObserverSelection$' -count=1 -timeout=25m -v
      - name: Reproduce seven-participant offline Compose generator test
        env:
          ENYGMA_W2_COMPOSE_OUT: ${{ runner.temp }}/w2-seven-graph
        working-directory: source/rayls-sovereign-cli
        run: go test ./internal/docker -run '^TestW2SevenOfflineCompose$' -count=1 -timeout=15m -v
